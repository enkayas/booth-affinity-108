<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booth Affinity</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="loading" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:9999;align-items:center;justify-content:center;font-size:20px;">
    Loading...
  </div>

  <main class="page-wrap">
    <section id="loginSection" class="card auth-card">
      <div class="auth-banner">
        <div class="auth-title">
          <svg class="auth-lotus" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 10c4 5 6 11 6 18-4-2-7-6-8-11-1 5-4 9-8 11 0-7 2-13 6-18h4Z" fill="currentColor"/>
            <path d="M18 22c6 2 10 6 12 12-6 0-12-2-16-7 0-2 2-4 4-5Z" fill="currentColor"/>
            <path d="M46 22c2 1 4 3 4 5-4 5-10 7-16 7 2-6 6-10 12-12Z" fill="currentColor"/>
            <path d="M24 34c3 2 5 5 6 9-6 0-11-2-15-6 2-2 5-3 9-3Z" fill="currentColor"/>
            <path d="M40 34c4 0 7 1 9 3-4 4-9 6-15 6 1-4 3-7 6-9Z" fill="currentColor"/>
            <path d="M30 30h4c3 10 8 17 14 21H16c6-4 11-11 14-21Z" fill="currentColor"/>
          </svg>
          <h1>Booth Affinity</h1>
        </div>
      </div>
      <p class="auth-subtext">Powered by BJP Nilgiris - IT &amp; Data Management</p>
      <p class="auth-subtext">For assistance Call 99625 41214 /97400 67042</p>
      <p class="auth-subtext">Login with phone number.</p>

      <form id="loginForm">
        <label for="phone">Phone Number</label>
        <input id="phone" type="text" placeholder="Enter 10-digit phone" />

        <label for="password">Password</label>
        <input id="password" type="password" />

        <div id="loginError" style="color:#c62828;margin:10px 0;"></div>

        <button type="submit">Login</button>
        <p class="auth-disclaimer">Properitory Data of BJP. Do not share</p>
      </form>
    </section>

    <section id="appSection" class="app-shell" style="display:none;">
      <div class="topbar">
        <div>
          <h2 id="userName"></h2>
          <div id="userMeta"></div>
        </div>
        <button id="logoutBtn" type="button">Logout</button>
      </div>

      <div class="card">
        <label for="boothSelect"><strong>Select Booth</strong></label>
        <select id="boothSelect">
          <option value="">Select Booth</option>
        </select>
      </div>

      <div class="card">
        <h3>Booth Details</h3>
        <div id="boothDetails"></div>
      </div>

      <div class="summary-grid">
        <div class="summary-card">A: <span id="summaryA">0</span></div>
        <div class="summary-card">B: <span id="summaryB">0</span></div>
        <div class="summary-card">C: <span id="summaryC">0</span></div>
        <div class="summary-card">D: <span id="summaryD">0</span></div>
        <div class="summary-card">E: <span id="summaryE">0</span></div>
        <div class="summary-card">Completed: <span id="completionPct">0%</span></div>
      </div>

      <div class="card">
        <h3>Affinity Entry</h3>
        <div id="votersContainer"></div>
        <div class="affinity-actions">
          <button id="submitAffinityBtn" type="button" disabled>Submit</button>
          <div id="affinitySaveStatus" class="muted"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
